name: CC-Morning

# on:
#   schedule:
#     - cron: '0 23 * * *' # รันเวลา 06:00 น. ทุกวัน (เวลาไทย)

on:
  schedule:
    - cron: '38 6 * * *' # รันเวลา 13:15 น. ทุกวัน (เวลาไทย)
  workflow_dispatch: # กดรันเองได้ทันทีโดยไม่ต้องกรอกข้อมูล

jobs:
  record_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🎬 ติดตั้ง FFmpeg สำหรับอัดและแปลงเสียง
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ⚡ ติดตั้ง Library ของ Python
      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai edge-tts

      # 🎙️ รันโปรแกรมบันทึกเสียง
      - name: Run Recorder Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # กำหนดเวลาคงที่ไปเลย เช่น 10800 (3 ชั่วโมง) หรือ 14400 (4 ชั่วโมง)
          RECORD_DURATION: '10800' 
        run: |
          python recorder.py

      # ☁️ ติดตั้ง Rclone
      - name: Install Rclone
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash

      # 📤 อัปโหลดเข้า Google Drive
      - name: Setup Rclone and Upload
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf

          TARGET_FOLDER="CNBC/$(TZ='Asia/Bangkok' date +'%Y-%m-%d')"

          echo "=== กำลังย้ายไฟล์ทั้งหมดเข้าโฟลเดอร์: $TARGET_FOLDER ==="

          rclone move ./ "mydrive:$TARGET_FOLDER" --include "*.mp3" --include "*.txt" --verbose
